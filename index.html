<script src="https://sdk.farcaster.xyz/v1/farcaster.js"></script>
    <script>
        // Farcaster SDK başlatma
        let sdk;
        
        // SDK'yı başlat ve ready durumunu bildir
        async function initFarcasterSDK() {
            try {
                sdk = new window.Farcaster.SDK();
                
                // Context bilgilerini al
                const context = await sdk.context;
                console.log('Farcaster Context:', context);
                
                // SDK'nın hazır olduğunu bildir - ÖNEMLİ!
                sdk.actions.ready();
                
                // Kullanıcı bilgilerini göster
                if (context.user) {
                    walletStatus.innerHTML = `✅ Farcaster: @${context.user.username || context.user.fid}`;
                    walletConnected = true;
                    walletAddress = context.user.fid;
                } else {
                    walletStatus.innerHTML = '⚠️ Kullanıcı bilgisi alınamadı';
                }
            } catch (error) {
                console.error('Farcaster SDK hatası:', error);
                // SDK yoksa normal cüzdan bağlantısı dene
                connectWallet();
            }
        }
        
        // Sayfa yüklendiğinde SDK'yı başlat
        if (typeof window.Farcaster !== 'undefined') {
            initFarcasterSDK();
        } else {
            // SDK yüklenene kadar bekle
            window.addEventListener('load', () => {
                if (typeof window.Farcaster !== 'undefined') {
                    initFarcasterSDK();
                } else {
                    connectWallet();
                }
            });
        }
        
        // Yıldız efekti
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
        
        // Elementler
        const storyText = document.getElementById('storyText');
        const charCounter = document.getElementById('charCounter');
        const saveBtn = document.getElementById('saveBtn');
        const mintBtn = document.getElementById('mintBtn');
        const tipBtn = document.getElementById('tipBtn');
        const walletStatus = document.getElementById('walletStatus');
        const loading = document.getElementById('loading');
        const successModal = document.getElementById('successModal');
        const modalMessage = document.getElementById('modalMessage');
        const closeModal = document.getElementById('closeModal');
        
        // Wallet bağlantısı simülasyonu
        let walletConnected = false;
        let walletAddress = '';
