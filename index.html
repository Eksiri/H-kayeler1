<script src="https://sdk.farcaster.xyz/v1/farcaster.js"></script>
    
    <script>
        // Farcaster SDK initialization
        let sdk;
        
        // Elementler (Tanımlama sirasini degistirmedik)
        const storyText = document.getElementById('storyText');
        const charCounter = document.getElementById('charCounter');
        const saveBtn = document.getElementById('saveBtn');
        const mintBtn = document.getElementById('mintBtn');
        const tipBtn = document.getElementById('tipBtn');
        const walletStatus = document.getElementById('walletStatus');
        const loading = document.getElementById('loading');
        const successModal = document.getElementById('successModal');
        const modalMessage = document.getElementById('modalMessage');
        const closeModal = document.getElementById('closeModal');
        
        // Wallet bağlantısı durumu
        let walletConnected = false;
        let walletAddress = ''; // Farcaster FID'si burada tutulacak
        
        // Yıldız efekti (Sayfa yüklenirken hemen başlar)
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
        
        // Farcaster SDK'yı başlatır
        async function initFarcasterSDK() {
            try {
                sdk = new window.Farcaster.SDK();
                const context = await sdk.context;
                
                // SDK'nın hazır olduğunu bildirir (Hata çözümü budur)
                sdk.actions.ready();
                
                if (context.user) {
                    walletAddress = context.user.fid.toString();
                    walletConnected = true;
                    walletStatus.innerHTML = `✅ Farcaster Connected: @${context.user.username || context.user.fid}`;
                } else {
                    walletStatus.innerHTML = '⚠️ Farcaster User Info Missing. Demo Mode.';
                    walletAddress = 'Demo Mode';
                    walletConnected = true;
                }
            } catch (error) {
                console.error('Farcaster SDK Error:', error);
                walletStatus.innerHTML = '⚠️ SDK Failed to Load. Demo Mode.';
                walletAddress = 'Demo Mode';
                walletConnected = true;
                // SDK başarısız olsa bile Frame'i açığa çıkarır
                if (window.sdk && window.sdk.actions && window.sdk.actions.ready) {
                    window.sdk.actions.ready(); 
                }
            }
        }
        
        // Sayfa yuklenir yuklenmez SDK'yi baslat
        if (typeof window.Farcaster !== 'undefined') {
            initFarcasterSDK();
        } else {
            // SDK yüklenmezse
            console.log('Farcaster SDK not found, running in pure Demo Mode.');
            walletStatus.innerHTML = '⚠️ Farcaster SDK Missing. Demo Mode.';
            walletAddress = 'Demo Mode';
            walletConnected = true;
            
            // Frame'i açığa çıkarır (Hata çözümü)
            if (window.sdk && window.sdk.actions && window.sdk.actions.ready) {
                window.sdk.actions.ready(); 
            }
        }
        
        // Karakter sayacı
        storyText.addEventListener('input', () => {
            const length = storyText.value.length;
            charCounter.textContent = `${length} / 500 characters`;
            
            if (length > 450) {
                charCounter.classList.add('warning');
            } else {
                charCounter.classList.remove('warning');
            }
        });
        
        // Kaydet butonu
        saveBtn.addEventListener('click', () => {
            const story = storyText.value.trim();
            
            if (!story) {
                showModal('❌ ERROR', 'Please write a story first!');
                return;
            }
            
            loading.classList.add('active');
            
            setTimeout(() => {
                const stories = JSON.parse(localStorage.getItem('stories') || '[]');
                stories.push({
                    text: story,
                    timestamp: new Date().toISOString(),
                    wallet: walletAddress
                });
                localStorage.setItem('stories', JSON.stringify(stories));
                
                loading.classList.remove('active');
                showModal('💾 SAVED', 'Your story has been saved successfully!');
                storyText.value = '';
                charCounter.textContent = '0 / 500 characters';
            }, 1500);
        });
        
        // NFT Mint button
        mintBtn.addEventListener('click', () => {
            const story = storyText.value.trim();
            
            if (!story) {
                showModal('❌ ERROR', 'Please write a story first!');
                return;
            }
            
            if (!walletConnected) {
                showModal('⚠️ WARNING', 'Please connect your wallet first!');
                return;
            }
            
            loading.classList.add('active');
            
            // Real NFT mint requires Base/Ethereum integration
            setTimeout(() => {
                loading.classList.remove('active');
                showModal(
                    '🎨 MINT PROCESS', 
                    'NFT mint process initiated! This feature requires smart contract integration. Running in demo mode.'
                );
            }, 2000);
        });
        
        // Tip button - Copy wallet address
        tipBtn.addEventListener('click', () => {
            const tipAddress = '0xc3d02D56A4f4B4fa549cb2C9Ee621B275Bd23ae4';
            
            navigator.clipboard.writeText(tipAddress).then(() => {
                tipBtn.textContent = '✅ COPIED!';
                tipBtn.style.background = '#00ff00';
                
                setTimeout(() => {
                    tipBtn.textContent = '📋 COPY WALLET ADDRESS';
                    tipBtn.style.background = '#00ff00';
                }, 2000);
            }).catch(err => {
                showModal('❌ ERROR', 'Copy failed. Please copy manually.');
            });
        });
        
        // Modal functions
        function showModal(title, message) {
            modalMessage.innerHTML = `<strong>${title}</strong><br><br>${message}`;
            successModal.classList.add('active');
        }
        
        closeModal.addEventListener('click', () => {
            successModal.classList.remove('active');
        });
        
        successModal.addEventListener('click', (e) => {
            if (e.target === successModal) {
                successModal.classList.remove('active');
            }
        });
    </script>
